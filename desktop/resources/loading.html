<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:transparent;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}

  /* 背景透明：霓虹光束直接浮在桌面上 */
  .bg{position:fixed;inset:0;background:transparent}
  .beam{position:absolute;height:2px;border-radius:50%;filter:blur(1.5px);
        background:linear-gradient(90deg,transparent,#4D6BFE,#9D7BFF,#4D6BFE,transparent);
        box-shadow:0 0 24px #4D6BFE,0 0 60px rgba(157,123,255,.5)}
  .b1{top:25%;left:-20%;width:140%;animation:sweep1 2.8s ease-in-out infinite}
  .b2{top:48%;left:-20%;width:140%;height:1.5px;animation:sweep2 2.4s ease-in-out infinite;
      background:linear-gradient(90deg,transparent,#6B8CFF,#C4A8FF,#6B8CFF,transparent)}
  .b3{top:70%;left:-20%;width:140%;height:1px;animation:sweep3 3.2s ease-in-out infinite}
  @keyframes sweep1{0%,100%{transform:translateX(-8%) rotate(-7deg);opacity:.4}
                    50%{transform:translateX(8%) rotate(-7deg);opacity:.95}}
  @keyframes sweep2{0%,100%{transform:translateX(7%) rotate(5deg);opacity:.5}
                    50%{transform:translateX(-7%) rotate(5deg);opacity:.9}}
  @keyframes sweep3{0%,100%{transform:translateX(-5%) rotate(-3deg);opacity:.35}
                    50%{transform:translateX(5%) rotate(-3deg);opacity:.85}}
  .dot{position:absolute;width:3px;height:3px;border-radius:50%;background:#9DB4FF;
       box-shadow:0 0 8px #4D6BFE;animation:tw 2.2s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}

  /* 中心区域 */
  .center{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}

  /* 鲸鱼：从上方砸落 */
  .whale{width:110px;height:110px;filter:drop-shadow(0 0 30px rgba(77,107,254,.9));
         transform:translateY(-600px);opacity:0;
         animation:slam .9s cubic-bezier(.2,1.6,.4,1) .5s forwards}
  @keyframes slam{
    0%{transform:translateY(-600px) scale(.8);opacity:0}
    60%{transform:translateY(10px) scale(1.05);opacity:1}
    80%{transform:translateY(-8px) scale(.98)}
    100%{transform:translateY(0) scale(1);opacity:1}
  }
  /* 砸落冲击波环 */
  .ring{position:absolute;left:50%;top:50%;width:0;height:0;border:2px solid #4D6BFE;
        border-radius:50%;transform:translate(-50%,-50%);opacity:0;
        animation:ring .8s ease-out 1.2s forwards;pointer-events:none}
  .ring.r2{animation-delay:1.35s;border-color:#9D7BFF}
  @keyframes ring{
    0%{width:60px;height:60px;opacity:.9}
    100%{width:520px;height:520px;opacity:0}
  }

  /* 标题：逐字破碎消融 */
  .title{margin-top:26px;display:flex;font-size:30px;font-weight:700;letter-spacing:4px;
         color:#EAF0FF;text-shadow:0 0 20px rgba(77,107,254,.9)}
  .title span{display:inline-block;opacity:0;transform:translateY(20px);
              animation:charIn .5s ease-out forwards}
  .title span.fade{animation:charOut .6s ease-in forwards}
  @keyframes charIn{to{opacity:1;transform:translateY(0)}}
  @keyframes charOut{
    0%{opacity:1;filter:blur(0);transform:translateY(0) scale(1)}
    100%{opacity:0;filter:blur(14px);transform:translateY(-30px) scale(1.4)}
  }
  .sub{margin-top:10px;font-size:13px;letter-spacing:8px;color:#7B8CC0;opacity:0;
       animation:subIn .6s ease-out 1.8s forwards}
  @keyframes subIn{to{opacity:.9}}

  /* 整体淡出（最后一帧，由主进程触发） */
  .stage{position:fixed;inset:0;animation:fadeout .6s ease-out forwards;animation-delay:3.2s}
  @keyframes fadeout{to{opacity:0;visibility:hidden}}
</style>
</head>
<body>
<div class="stage">
  <div class="bg">
    <div class="beam b1"></div>
    <div class="beam b2"></div>
    <div class="beam b3"></div>
    <div class="dot" style="top:18%;left:22%"></div>
    <div class="dot" style="top:35%;left:78%;animation-delay:.6s"></div>
    <div class="dot" style="top:62%;left:15%;animation-delay:1.1s"></div>
    <div class="dot" style="top:80%;left:68%;animation-delay:1.6s"></div>
    <div class="dot" style="top:25%;left:55%;animation-delay:.3s"></div>
  </div>
  <div class="ring"></div>
  <div class="ring r2"></div>
  <div class="center">
    <svg class="whale" viewBox="0 0 120 120"><g fill="#4D6BFE">
      <path d="M60 18c-24 0-42 15-42 36 0 10 5 19 13 25-4 5-8 12-9 19 5-1 10-4 15-7 7 4 15 6 23 6 24 0 42-15 42-36S84 18 60 18z"/>
      <circle cx="34" cy="53" r="6"/><circle cx="86" cy="53" r="6"/>
    </g></svg>
    <div class="title" id="title"></div>
    <div class="sub">探索未至之境</div>
  </div>
</div>
<script>
  // 逐字打印，每个字延迟入场
  var text = "DeepSeek Harness";
  var title = document.getElementById('title');
  for (var i = 0; i < text.length; i++) {
    var s = document.createElement('span');
    s.textContent = text[i] === ' ' ? '\u00A0' : text[i];
    s.style.animationDelay = (1.5 + i * 0.09) + 's';
    title.appendChild(s);
  }
  // 全部字入完后，逐个破碎消融
  var chars = title.children;
  var lastIn = 1.5 + text.length * 0.09;
  for (var j = 0; j < chars.length; j++) {
    (function(el, idx){
      setTimeout(function(){ el.classList.add('fade'); }, (lastIn + 0.3 + idx * 0.08) * 1000);
    })(chars[j], j);
  }
</script>
</body>
</html>
