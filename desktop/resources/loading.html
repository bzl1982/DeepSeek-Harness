<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeepSeek Harness</title>
<!--
  启动 Splash（正式版）：透明背景，特效浮在桌面壁纸上
  叙事：鲸鱼（动画 WebP）在下方从左向右游 → 游到字母位置头顶喷泉逐个喷出字母
        → 字母真斜抛砸落标题线（音效+尘土+冲击环）→ 排成品牌蓝标题（整行≈88%屏宽）
        → 鲸鱼游走 → 字母裂纹逐个裂成蓝色碎块（慢慢消融）→ 通知主进程转场
  状态机由 setInterval 真实时间推进（主界面预加载竞争时 rAF 可能被饿死，
  若状态推进也依赖 rAF 会导致 done 信号延迟、窗口迟迟不出现；因此拆分：
  tick 推进状态/物理/破碎/done，rAF 只负责渲染）
-->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
       background:transparent}                    /* 透明：特效浮在桌面壁纸上 */

  /* ---- 鲸鱼（图片素材，下方水面游动；位置由 JS 控制：游到字母位置才喷） ---- */
  #whale{position:fixed;z-index:1;width:min(16vw,22vh);height:auto;display:block;
    left:50%;top:62vh;margin-left:calc(-1 * min(8vw,11vh));
    opacity:0;pointer-events:none;
    filter:drop-shadow(0 0 26px rgba(77,107,254,.6)) drop-shadow(0 0 70px rgba(120,110,255,.25))}

  /* ---- 字母行（最终拼成标题；= 地面线，在水柱之上） ---- */
  #letters{position:fixed;left:50%;top:30vh;transform:translateX(-50%);z-index:3;
    display:flex;align-items:baseline;white-space:nowrap}
  .ch{display:inline-block;font-weight:900;letter-spacing:.01em;line-height:1;
    color:#4D6BFE;opacity:0;will-change:transform,opacity;   /* DeepSeek 品牌蓝，与 LOGO 鲸鱼一致 */
    text-shadow:0 0 16px rgba(94,120,255,.85),0 0 48px rgba(77,107,254,.5),0 0 90px rgba(77,107,254,.35)}
  .ch.landed{opacity:1}
  .ch.shattering{opacity:0;transition:opacity .1s}

  /* ---- 特效画布（水柱/尘土/冲击环/破碎粒子；在字母之下、鲸鱼之上） ---- */
  canvas#fx{position:fixed;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
</style>
</head>
<body>
  <!-- 鲸鱼：动态动画（6帧动画 WebP，循环播放）；头朝右、从左向右游 -->
  <img id="whale" src="whale-anim.webp" alt="whale">

  <!-- 字母行 -->
  <div id="letters"></div>

  <canvas id="fx"></canvas>

<script>
(function(){
  'use strict';
  var TITLE = "DeepSeek Harness";

  var whaleEl = document.getElementById('whale');
  var lettersEl = document.getElementById('letters');
  var cv = document.getElementById('fx');
  var ctx = cv.getContext('2d');
  var W = 0, H = 0, dpr = 1;

  /* ---------- 画布尺寸 ---------- */
  function sizeCanvas(){
    W = document.documentElement.clientWidth;
    H = document.documentElement.clientHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 1.25);
    cv.width = W * dpr; cv.height = H * dpr;
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  sizeCanvas();
  window.addEventListener('resize', sizeCanvas);

  /* 软件窗口宽度：main.js 启动时以 ?w= 传入主窗口宽；兜底按屏宽 35% */
  var qw = parseInt((location.search.match(/[?&]w=(\d+)/) || [])[1] || '', 10);
  var WIN_W = qw || Math.round(W * 0.35);
  var winL = (W - WIN_W) / 2, winR = (W + WIN_W) / 2;

  /* ---------- 字母创建（整行宽 ≤ 软件窗口宽，多分辨率自适应） ---------- */
  var letters = [];
  function buildLetters(){
    lettersEl.innerHTML = '';
    letters = [];
    var target = Math.min(WIN_W * 0.92, W * 0.88);
    var probe = document.createElement('span');
    probe.style.cssText = 'font-weight:900;font-size:100px;visibility:hidden;position:fixed';
    probe.textContent = TITLE;
    document.body.appendChild(probe);
    var w = probe.getBoundingClientRect().width || 1;
    document.body.removeChild(probe);
    var fs = Math.round(100 * target / w);
    var split = TITLE.split('');
    for (var i = 0; i < split.length; i++){
      var s = document.createElement('span');
      s.className = 'ch';
      s.textContent = split[i] === ' ' ? '\u00A0' : split[i];
      s.style.fontSize = fs + 'px';
      lettersEl.appendChild(s);
      letters.push({ el: s, ch: split[i] });
    }
    return fs;
  }

  /* ---------- 音频（Web Audio 合成：落地撞击 + 尘土噪声 + 破碎） ---------- */
  var actx = null;
  function ensureAudio(){
    if (!actx){
      try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return null; }
    }
    if (actx.state === 'suspended'){ actx.resume(); }
    return actx;
  }
  function playThud(){
    var a = ensureAudio(); if (!a || a.state !== 'running') return;
    var t = a.currentTime;
    var o = a.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(95, t);
    o.frequency.exponentialRampToValueAtTime(38, t + 0.28);
    var g = a.createGain();
    g.gain.setValueAtTime(0.75, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
    o.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t + 0.45);
    var len = Math.floor(a.sampleRate * 0.32);
    var buf = a.createBuffer(1, len, a.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.2);
    var n = a.createBufferSource(); n.buffer = buf;
    var flt = a.createBiquadFilter(); flt.type = 'lowpass'; flt.frequency.setValueAtTime(900, t);
    flt.frequency.exponentialRampToValueAtTime(180, t + 0.3);
    var ng = a.createGain();
    ng.gain.setValueAtTime(0.55, t);
    ng.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
    n.connect(flt); flt.connect(ng); ng.connect(a.destination);
    n.start(t);
    var o2 = a.createOscillator(); o2.type = 'triangle';
    o2.frequency.setValueAtTime(260, t); o2.frequency.exponentialRampToValueAtTime(70, t + 0.12);
    var g2 = a.createGain();
    g2.gain.setValueAtTime(0.28, t); g2.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
    o2.connect(g2); g2.connect(a.destination);
    o2.start(t); o2.stop(t + 0.16);
  }
  function playShatter(){
    var a = ensureAudio(); if (!a || a.state !== 'running') return;
    var t = a.currentTime;
    var len = Math.floor(a.sampleRate * 0.18);
    var buf = a.createBuffer(1, len, a.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 1.6);
    var n = a.createBufferSource(); n.buffer = buf;
    var bp = a.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 3200; bp.Q.value = 1.4;
    var ng = a.createGain();
    ng.gain.setValueAtTime(0.16, t); ng.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
    n.connect(bp); bp.connect(ng); ng.connect(a.destination);
    n.start(t);
  }

  /* ---------- 字母物理（被水柱顶起 → 真斜抛 → 砸地 → 弹跳 → 静止） ---------- */
  var G_LETTER = 2400;

  function initOne(L, wr){
    var r = L.el.getBoundingClientRect();
    var sx = wr.left + wr.width * 0.60;
    var sy = wr.top + wr.height * 0.105;
    var fx = r.left + r.width / 2;
    var fy = r.top + r.height / 2;
    var flight = 0.95;
    L.state = {
      x: sx, y: sy, tx: fx, ty: fy,
      vx: (fx - sx) / flight,
      vy: -1350 - Math.random() * 300,
      age: 0, flight: flight,
      phase: 'fly', dusted: false
    };
    L.el.style.opacity = 1;
    for (var i = 0; i < 26; i++){
      var dir = Math.random() < 0.5 ? -1 : 1;
      water.push({
        x: sx + (Math.random() - 0.5) * 8,
        y: sy - 4,
        vx: dir * (180 + Math.random() * 420),
        vy: -120 - Math.random() * 260,
        r: 1.4 + Math.random() * 2.2,
        life: 0, max: 0.2 + Math.random() * 0.18,
        mist: false
      });
    }
  }

  function updatePhysics(dt){
    for (var i = 0; i < letters.length; i++){
      var L = letters[i];
      var st = L.state;
      if (!st || st.phase === 'done') continue;
      if (st.phase === 'fly'){
        st.age += dt;
        st.vy += G_LETTER * dt;
        st.x += st.vx * dt;
        st.y += st.vy * dt;
        if (st.vy > 0 && st.y >= st.ty){
          if (st.vy > 820){
            st.vy = -st.vy * 0.36;
            st.y = st.ty;
            L.el.classList.add('landed');
            if (!st.dusted){
              st.dusted = true;
              spawnDust(st.tx, st.ty + 6, Math.min(1, st.vy / 2600));
              rings.push({ x: st.tx, y: st.ty + 4, r: 5, a: 0.55 });
              playThud();
            }
          } else {
            st.phase = 'settle';
            L.el.classList.add('landed');
            L.el.style.transition = 'transform 0.45s cubic-bezier(.2,.85,.3,1)';
            L.el.style.transform = 'translate(0,0)';
            var s = st;
            setTimeout(function(){ s.phase = 'done'; }, 480);
            continue;
          }
        }
        L.el.style.transform = 'translate(' + (st.x - st.tx) + 'px,' + (st.y - st.ty) + 'px)';
      }
    }
  }

  /* ---------- 水柱系统（粒子水花 + 水雾 + 顶端散开） ---------- */
  var water = [];
  var rings = [];
  var WATER = {
    rate: 160,
    mistRate: 55,
    launchMin: 1450, launchMax: 1800,
    gravity: 1850,
    airResist: 0.985,
    plumeH: 480
  };

  function sprayWater(wr, dt, t){
    if (t < T_ENTER || t > goneEnd) return;
    var sx = wr.left + wr.width * 0.60;
    var sy = wr.top + wr.height * 0.105;
    var n = Math.round(WATER.rate * dt);
    var nm = Math.round(WATER.mistRate * dt);
    for (var j = 0; j < n; j++){
      var mist = Math.random() < 0.22;
      water.push({
        x: sx + (Math.random() - 0.5) * 6,
        y: sy,
        vx: (Math.random() - 0.5) * 120 + (mist ? (Math.random() - 0.5) * 260 : 0),
        vy: -(WATER.launchMin + Math.random() * (WATER.launchMax - WATER.launchMin)),
        r: mist ? 5 + Math.random() * 8 : 2 + Math.random() * 2.6,
        life: 0,
        max: mist ? 0.4 + Math.random() * 0.35 : 0.7 + Math.random() * 0.5,
        mist: mist
      });
    }
    for (j = 0; j < nm; j++){
      water.push({
        x: sx + (Math.random() - 0.5) * 10,
        y: sy,
        vx: (Math.random() - 0.5) * 300,
        vy: -1000 - Math.random() * 500,
        r: 5 + Math.random() * 9,
        life: 0, max: 0.35 + Math.random() * 0.35,
        mist: true
      });
    }
  }

  function drawDroplet(p){
    var alpha = Math.max(0, 1 - p.life / p.max);
    if (p.mist){
      var mr = p.r * (1 + (p.life / p.max) * 3.2);
      ctx.fillStyle = 'rgba(235,250,255,' + (alpha * 0.10).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(p.x, p.y, mr, 0, Math.PI * 2); ctx.fill();
      return;
    }
    var speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
    var stretch = Math.min(3, 1 + speed / 600);
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(Math.atan2(p.vy, p.vx));
    ctx.fillStyle = 'rgba(215,242,255,' + (alpha * 0.8).toFixed(3) + ')';
    ctx.beginPath();
    ctx.ellipse(0, 0, p.r * stretch, p.r / Math.sqrt(stretch), 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function updateWater(dt){
    ctx.globalCompositeOperation = 'screen';
    for (var i = water.length - 1; i >= 0; i--){
      var p = water[i];
      p.life += dt;
      if (p.life > p.max){ water.splice(i, 1); continue; }
      p.vy += WATER.gravity * dt;
      var f = Math.pow(WATER.airResist, dt * 60);
      p.vx *= f; p.vy *= f;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      drawDroplet(p);
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  function spawnCrownDrops(sx, sy, apexY){
    for (var i = 0; i < 2; i++){
      var dir = Math.random() < 0.5 ? -1 : 1;
      water.push({
        x: sx + (Math.random() - 0.5) * 14,
        y: apexY + 6,
        vx: dir * (120 + Math.random() * 260),
        vy: -30 - Math.random() * 160,
        r: 1.2 + Math.random() * 2.6,
        life: 0, max: 0.5 + Math.random() * 0.5,
        mist: false
      });
    }
  }

  function updateRings(dt){
    for (var i = rings.length - 1; i >= 0; i--){
      var r = rings[i];
      r.r += 250 * dt;
      r.a -= 2.4 * dt;
      if (r.a <= 0){ rings.splice(i, 1); continue; }
      ctx.strokeStyle = 'rgba(190,215,255,' + Math.max(0, r.a).toFixed(3) + ')';
      ctx.lineWidth = 2.5 * Math.max(0, r.a) + 0.6;
      ctx.beginPath();
      ctx.ellipse(r.x, r.y, r.r, r.r * 0.28, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  /* ---------- 尘土粒子（字母砸地扬起） ---------- */
  var dust = [];
  function spawnDust(x, y, power){
    for (var i = 0; i < 40; i++){
      dust.push({
        x: x, y: y,
        vx: (Math.random() - 0.5) * (360 + 560 * power),
        vy: -30 - Math.random() * (120 + 220 * power),
        r: 2 + Math.random() * 5,
        life: 0, max: 0.55 + Math.random() * 0.55,
        c: Math.random() < 0.65 ? [168,188,255] : [140,158,235]
      });
    }
  }
  function updateDust(dt){
    for (var i = dust.length - 1; i >= 0; i--){
      var p = dust[i];
      p.life += dt;
      if (p.life > p.max){ dust.splice(i, 1); continue; }
      p.vy += 700 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      var a = Math.max(0, 1 - p.life / p.max) * 0.85;
      ctx.fillStyle = 'rgba(' + p.c[0] + ',' + p.c[1] + ',' + p.c[2] + ',' + a + ')';
      ctx.fillRect(p.x - p.r / 2, p.y - p.r / 2, p.r, p.r);
    }
  }

  /* ---------- 破碎：玻璃破碎（裂纹 → 字母蓝色碎块旋转飞散 → 溶解消融） ---------- */
  var shards = [];
  var glass = [];
  var cracks = [];

  function shatterLetter(L, fs){
    if (L.ch === ' '){ L.el.style.opacity = 0; return; }
    var r = L.el.getBoundingClientRect();
    var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    var diag = Math.max(r.width, r.height) * 0.62;

    var off = document.createElement('canvas');
    off.width = Math.ceil(r.width * dpr); off.height = Math.ceil(r.height * dpr);
    var o = off.getContext('2d');
    o.scale(dpr, dpr);
    o.font = '900 ' + fs + 'px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';
    o.textAlign = 'center'; o.textBaseline = 'middle';
    o.shadowColor = 'rgba(77,107,254,.55)'; o.shadowBlur = 10;
    o.fillStyle = '#4D6BFE';
    o.fillText(L.ch, r.width / 2, r.height / 2 + fs * 0.03);
    o.shadowBlur = 0;
    o.fillText(L.ch, r.width / 2, r.height / 2 + fs * 0.03);

    var nCr = 4 + Math.floor(Math.random() * 3);
    var crPts = [];
    for (var k = 0; k < nCr; k++){
      var aC = Math.random() * Math.PI * 2;
      var rC = diag * (0.5 + Math.random() * 0.6);
      crPts.push({ x: cx + Math.cos(aC) * rC, y: cy + Math.sin(aC) * rC });
    }
    cracks.push({ cx: cx, cy: cy, pts: crPts, life: 0, max: 0.42 });

    var n = 6 + Math.floor(Math.random() * 5);
    var angles = [];
    for (var i = 0; i < n; i++) angles.push(Math.random() * Math.PI * 2);
    angles.sort(function(a, b){ return a - b; });
    angles.push(angles[0] + Math.PI * 2);
    for (var i = 0; i < n; i++){
      var a1 = angles[i], a2 = angles[i + 1];
      var am = (a1 + a2) / 2;
      var R1 = diag * (0.32 + Math.random() * 0.3);
      var R2 = diag * (0.32 + Math.random() * 0.3);
      var jitter = function(){ return (Math.random() * 0.2 - 0.1); };
      var poly = [
        { x: Math.random() * 9 - 4.5, y: Math.random() * 9 - 4.5 },
        { x: Math.cos(a1 + jitter()) * R1, y: Math.sin(a1 + jitter()) * R1 },
        { x: Math.cos(am + jitter()) * diag * (0.85 + Math.random() * 0.3),
          y: Math.sin(am + jitter()) * diag * (0.85 + Math.random() * 0.3) },
        { x: Math.cos(a2 + jitter()) * R2, y: Math.sin(a2 + jitter()) * R2 }
      ];
      var spd = 80 + Math.random() * 220;
      var dir = am + (Math.random() * 0.8 - 0.4);
      glass.push({
        poly: poly,
        img: off, iw: r.width, ih: r.height,
        x: cx, y: cy,
        vx: Math.cos(dir) * spd, vy: -50 - Math.random() * 230,
        rot: Math.random() * Math.PI * 2, vr: (Math.random() - 0.5) * 7,
        life: 0, max: 1.6 + Math.random() * 1.5
      });
    }

    for (var j = 0; j < 16; j++){
      var px = cx + (Math.random() - 0.5) * r.width * 0.85;
      var py = cy + (Math.random() - 0.5) * r.height * 0.85;
      shards.push({
        x: px, y: py,
        vx: (Math.random() - 0.5) * 400,
        vy: -60 - Math.random() * 300,
        r: 0.8 + Math.random() * 1.7,
        life: 0, max: 0.7 + Math.random() * 0.9,
        c: Math.random() < 0.5 ? [190,210,255] : [235,242,255]
      });
    }

    L.el.style.opacity = 0;
    playShatter();
  }

  function updateGlass(dt){
    for (var i = glass.length - 1; i >= 0; i--){
      var g = glass[i];
      g.life += dt;
      if (g.life > g.max){ glass.splice(i, 1); continue; }
      g.vy += 460 * dt;
      g.x += g.vx * dt;
      g.y += g.vy * dt;
      g.rot += g.vr * dt;
      var p = g.life / g.max;
      var a = p < 0.55 ? 1 : Math.max(0, 1 - (p - 0.55) / 0.45);
      ctx.save();
      ctx.translate(g.x, g.y);
      ctx.rotate(g.rot);
      ctx.beginPath();
      ctx.moveTo(g.poly[0].x, g.poly[0].y);
      for (var k = 1; k < g.poly.length; k++) ctx.lineTo(g.poly[k].x, g.poly[k].y);
      ctx.closePath();
      ctx.clip();
      ctx.globalAlpha = a;
      ctx.drawImage(g.img, -g.iw / 2, -g.ih / 2, g.iw, g.ih);
      ctx.globalAlpha = 1;
      ctx.restore();
    }
  }

  function updateCracks(dt){
    for (var i = cracks.length - 1; i >= 0; i--){
      var c = cracks[i];
      c.life += dt;
      if (c.life > c.max){ cracks.splice(i, 1); continue; }
      var a = 1 - c.life / c.max;
      ctx.strokeStyle = 'rgba(255,255,255,' + (a * 0.9).toFixed(3) + ')';
      ctx.lineWidth = 1.6;
      for (var k = 0; k < c.pts.length; k++){
        ctx.beginPath();
        ctx.moveTo(c.cx, c.cy);
        ctx.lineTo(c.pts[k].x, c.pts[k].y);
        ctx.stroke();
      }
    }
  }

  function updateShards(dt){
    for (var i = shards.length - 1; i >= 0; i--){
      var p = shards[i];
      p.life += dt;
      if (p.life > p.max){ shards.splice(i, 1); continue; }
      p.vy += 640 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 0.98;
      var a = Math.max(0, 1 - p.life / p.max) * 0.95;
      ctx.fillStyle = 'rgba(' + p.c[0] + ',' + p.c[1] + ',' + p.c[2] + ',' + a + ')';
      ctx.fillRect(p.x - p.r / 2, p.y - p.r / 2, p.r, p.r);
    }
  }

  /* ---------- 阶段机 ---------- */
  var playing = false, timer = 0, fontSize = 0;
  var T_ENTER = 0.4, T_IN = 1.0, SPRAY_GAP = 0.4, T_OUT = 7.5, T_GONE = 0.8;
  var T_SPRAY = T_ENTER + T_IN;
  var sprayEnd = 0, goneEnd = 0;

  function easeInOut(p){ return p < 0.5 ? 2*p*p : 1 - Math.pow(-2*p+2, 2)/2; }

  function reset(){
    timer = 0;
    dust.length = 0; shards.length = 0; glass.length = 0; cracks.length = 0;
    water.length = 0; rings.length = 0;
    whaleEl.style.opacity = 0;
    whaleEl.style.transform = '';
    letters.forEach(function(L){
      L.el.className = 'ch';
      L.el.style.opacity = 0;
      L.el.style.transform = '';
      L.state = null;
    });
  }

  function play(){
    reset();
    fontSize = buildLetters();
    letters.forEach(function(L){
      var r = L.el.getBoundingClientRect();
      L.landX = r.left + r.width / 2;
      L.landY = r.top + r.height / 2;
    });
    playing = true;
    var t0 = performance.now();
    var lastTick = t0;
    var lastFrame = t0;
    var whaleOut = false, shatterIdx = 0, shatterClock = -1, whiteDone = false, bridgeSent = false;
    sprayEnd = T_SPRAY + (letters.length - 1) * SPRAY_GAP;
    goneEnd = sprayEnd + T_OUT + T_GONE;
    var wx = -0.5 * W;

    function whalePos(t){
      if (t < T_ENTER) return -0.5 * W;
      if (t < T_SPRAY){
        var p = (t - T_ENTER) / T_IN;
        return -0.5 * W + (winL - (-0.5 * W)) * easeInOut(p);
      }
      if (t < sprayEnd){
        var p = (t - T_SPRAY) / (sprayEnd - T_SPRAY);
        return winL + (winR - winL) * p;
      }
      if (t < goneEnd){
        var p = (t - sprayEnd) / (T_OUT + T_GONE);
        return winR + (1.5 * W - winR) * easeInOut(p);
      }
      return 1.5 * W;
    }

    /* 状态机：setInterval 真实时间推进（rAF 被主界面加载饿死时也按时转场） */
    function tick(){
      if (!playing) return;
      var now = performance.now();
      var dt = Math.min(0.1, (now - lastTick) / 1000);
      lastTick = now;
      timer = (now - t0) / 1000;
      wx = whalePos(timer);

      var wr = whaleEl.getBoundingClientRect();
      for (var i = 0; i < letters.length; i++){
        var L = letters[i];
        if (!L.state && wx >= L.landX - 12){
          initOne(L, wr);
        }
      }
      updatePhysics(dt);

      var allDone = letters.every(function(l){ return l.state && l.state.phase === 'done'; });
      if (allDone && !whaleOut && timer > goneEnd - 0.5){
        whaleOut = true;
      }

      if (allDone && timer > goneEnd + 0.5 && shatterIdx < letters.length){
        if (shatterClock < 0) shatterClock = timer;
        var need = Math.floor((timer - shatterClock) / 0.42);
        while (shatterIdx < letters.length && need >= shatterIdx){
          shatterLetter(letters[shatterIdx], fontSize);
          shatterIdx++;
        }
      }

      if (shatterIdx >= letters.length - 2 && !whiteDone){
        whiteDone = true;
        setTimeout(function(){
          if (!bridgeSent && window.splashBridge && window.splashBridge.done){
            bridgeSent = true;
            window.splashBridge.done();
          }
        }, 400);
      }
    }
    var tickHandle = setInterval(tick, 50);

    /* 渲染：rAF 驱动（状态只读） */
    function frame(now){
      if (!playing) return;
      var dt = Math.min(0.05, (now - lastFrame) / 1000);
      lastFrame = now;

      ctx.clearRect(0, 0, W, H);

      var floatY = Math.sin(timer * 1.6) * Math.min(10, H * 0.008);
      var pitch = Math.sin(timer * 1.2 + 0.8) * 0.8;
      whaleEl.style.transform = 'translateX(' + (wx - W / 2) + 'px) translateY(' + floatY + 'px) rotate(' + pitch + 'deg)';
      if (timer >= T_ENTER && timer < goneEnd - 0.6){
        whaleEl.style.opacity = Math.min(1, (timer - T_ENTER) / 0.5);
      } else if (timer >= goneEnd - 0.6){
        whaleEl.style.opacity = Math.max(0, 1 - (timer - (goneEnd - 0.6)) / 0.6);
      }

      var wr = whaleEl.getBoundingClientRect();
      sprayWater(wr, dt, timer);
      spawnCrownDrops(wr.left + wr.width * 0.60, wr.top + wr.height * 0.105,
                      wr.top + wr.height * 0.105 - WATER.plumeH);

      updateDust(dt);
      updateWater(dt);
      updateRings(dt);
      updateCracks(dt);
      updateGlass(dt);
      updateShards(dt);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  play();
})();
</script>
