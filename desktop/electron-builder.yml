appId: ai.deepseek.harness.desktop
productName: DeepSeek Harness
directories:
  output: dist
  buildResources: build

files:
  - src/**/*

# 运行时资源：dsh 的 node_modules（生产依赖） + 官方 Node.js 运行时
# 均由构建前脚本生成（scripts/），不入库：
#   Windows: scripts/prepare-runtime.ps1
#   macOS:   scripts/build-mac.sh
extraResources:
  - from: resources/dsh-runtime
    to: dsh-runtime
    filter:
      - '**/*'
  - from: resources/node-runtime
    to: node-runtime
    filter:
      - '**/*'
  - from: resources/loading.mp4
    to: loading.mp4

# ---------------- Windows ----------------
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DeepSeek Harness
  artifactName: ${productName}-${version}-setup-${arch}.${ext}

portable:
  artifactName: ${productName}-${version}-portable-${arch}.${ext}

# ---------------- macOS ----------------
mac:
  icon: build/icon.icns
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  artifactName: ${productName}-${version}-${arch}.${ext}
  hardenedRuntime: false
  gatekeeperAssess: false

dmg:
  title: ${productName} ${version}
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# ---------------- 通用 ----------------
npmRebuild: false
electronLanguages:
  - zh-CN
  - en-US
