<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>AI 会议</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0b0e14; color: #e6e6e6; font-family: 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* 顶栏 */
    .header { padding: 12px 20px; background: #1a2332; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #2a3a4a; }
    .header h1 { font-size: 16px; color: #4da3ff; }
    .header .controls button { padding: 6px 14px; background: #2a3a4a; color: #e6e6e6; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; margin-left: 8px; }
    .header .controls button:hover { background: #3a4a5a; }

    /* 主区域：左宫格 + 右侧栏 */
    .main { flex: 1; display: flex; overflow: hidden; }

    /* 宫格区 */
    .grid { flex: 1; display: grid; gap: 4px; padding: 8px; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); }
    .cell { position: relative; background: #1a1f28; border-radius: 8px; overflow: hidden; border: 1px solid #2a3a4a; }
    .cell .label { position: absolute; top: 6px; left: 6px; z-index: 100; background: rgba(0,0,0,0.7); color: #4da3ff; padding: 2px 8px; border-radius: 4px; font-size: 11px; } .cell .zoom-btn { position: absolute; top: 6px; right: 6px; z-index: 100; background: rgba(0,0,0,0.7); color: #4da3ff; border: none; border-radius: 4px; padding: 2px 8px; font-size: 13px; cursor: pointer; } .cell .zoom-btn:hover { background: rgba(77,163,255,0.3); } .cell .shrink-btn { position: absolute; top: 6px; right: 48px; z-index: 100; background: rgba(255,100,100,0.7); color: #fff; border: none; border-radius: 4px; padding: 2px 8px; font-size: 13px; cursor: pointer; } .cell .popout-btn { position: absolute; top: 6px; right: 48px; z-index: 100; background: rgba(0,0,0,0.7); color: #4da3ff; border: none; border-radius: 4px; padding: 2px 8px; font-size: 13px; cursor: pointer; } .cell .popout-btn:hover { background: rgba(77,163,255,0.3); } .cell .shrink-btn:hover { background: rgba(255,100,100,0.9); }
    .cell webview { width: 100%; height: 100%; border: none; }

    /* 右侧栏：AI 回答折叠抄送 */
    .sidebar { width: 360px; background: #121820; border-left: 1px solid #2a3a4a; display: flex; flex-direction: column; }
    .sidebar h2 { padding: 12px 16px; font-size: 14px; color: #4da3ff; border-bottom: 1px solid #2a3a4a; }
    .sidebar .feed { flex: 1; overflow-y: auto; padding: 8px; }
    .feed-item { margin-bottom: 8px; background: #1a2332; border-radius: 6px; overflow: hidden; }
    .feed-item .item-header { padding: 8px 12px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    .feed-item .item-header .model-name { color: #4da3ff; font-size: 12px; }
    .feed-item .item-header .time { color: #666; font-size: 11px; }
    .feed-item .item-body { display: none; padding: 8px 12px; font-size: 13px; color: #ccc; border-top: 1px solid #2a3a4a; max-height: 300px; overflow-y: auto; }
    .feed-item.expanded .item-body { display: block; }
    .feed-item.user-msg { background: #1a3a2a; }
    .feed-item.user-msg .item-header .model-name { color: #4ade80; }

    /* 底部用户发言框 */
    .input-bar { padding: 12px 20px; background: #1a2332; border-top: 1px solid #2a3a4a; display: flex; gap: 10px; }
    .input-bar input { flex: 1; padding: 10px 14px; background: #0b0e14; color: #e6e6e6; border: 1px solid #2a3a4a; border-radius: 8px; font-size: 14px; outline: none; }
    .input-bar input:focus { border-color: #4da3ff; }
    .input-bar button { padding: 10px 20px; background: #4da3ff; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; }
    .input-bar button:hover { background: #5db3ff; }
  </style>
</head>
<body>
  <div class="header">
    <h1>AI 会议</h1>
    <div class="controls">
      <button id="btn-fullscreen">⛶ 全屏</button>
      <button id="btn-grid3x3">3×3</button>
      <button id="btn-grid4x3">4×3</button>
    </div>
  </div>

  <div class="main">
    <div class="grid" id="grid"></div>
    <div class="sidebar">
      <h2>会议记录</h2>
      <div class="feed" id="feed"></div>
    </div>
  </div>

  <div class="input-bar">
    <input id="user-input" placeholder="输入你的问题，所有 AI 都会看到...">
    <button id="btn-send">发送</button>
  </div>

  <script>
    // 会议配置：7 个网页版 AI
    const MODELS = [
      { id: 'deepseek-web', name: 'DeepSeek', url: 'https://chat.deepseek.com/' },
      { id: 'chatgpt-web', name: 'ChatGPT', url: 'https://chatgpt.com/' },
      { id: 'kimi-web', name: 'Kimi', url: 'https://kimi.moonshot.cn/' },
      { id: 'doubao-web', name: '豆包', url: 'https://www.doubao.com/chat/' },
      { id: 'tongyi-web', name: '通义', url: 'https://tongyi.aliyun.com/qianwen/' },
      { id: 'yuanbao-web', name: '元宝', url: 'https://yuanbao.tencent.com/chat' },
      { id: 'gemini-web', name: 'Gemini', url: 'https://gemini.google.com/app' },
      { id: 'google-search', name: '谷歌搜索', url: 'https://www.google.com/search?q=' },
      { id: 'wenxin-web', name: '文心', url: 'https://yiyan.baidu.com/' },
    ];

    const grid = document.getElementById('grid');
    const feed = document.getElementById('feed');
    const userInput = document.getElementById('user-input');

    // 创建宫格
    function buildGrid(cols, rows) {
      grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
      grid.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
      grid.innerHTML = '';
      MODELS.forEach((m) => {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.providerId = m.id;
        cell.innerHTML = `
          <div class="label">${m.name}</div>
          <button class="zoom-btn" title="宫格放大">⛶</button>
          <button class="popout-btn" title="跳出成独立浏览器窗口（登录用）">🔗</button>
          <button class="shrink-btn" title="缩小" style="display:none;">✕</button>
        `;
        // 跳出：弹出独立浏览器窗口（完整浏览器功能，登录用）
        cell.querySelector('.popout-btn').onclick = () => {
          if (window.meetingBridge && window.meetingBridge.openBrowser) {
            window.meetingBridge.openBrowser(m.id, m.url);
          }
        };
        const zoomBtn = cell.querySelector('.zoom-btn');
        const shrinkBtn = cell.querySelector('.shrink-btn');
        // 放大：这个 cell 覆盖整个宫格区（同一个 webview，不刷新）
        zoomBtn.onclick = () => {
          cell.style.gridColumn = '1 / -1';
          cell.style.gridRow = '1 / -1';
          zoomBtn.style.display = 'none';
          shrinkBtn.style.display = 'block';
          // webview 滚动到底部（输入框位置）
          const wv = cell.querySelector('webview');
          if (wv) {
            wv.executeJavaScript('window.scrollTo(0, document.body.scrollHeight);').catch(() => {});
          }
        };
        // 缩小：回到宫格位置，且 webview 滚动到输入框位置（底部）
        shrinkBtn.onclick = () => {
          cell.style.gridColumn = '';
          cell.style.gridRow = '';
          zoomBtn.style.display = 'block';
          shrinkBtn.style.display = 'none';
          // webview 滚动到底部（输入框位置）
          const wv = cell.querySelector('webview');
          if (wv) {
            wv.executeJavaScript('window.scrollTo(0, document.body.scrollHeight);').catch(() => {});
          }
        };
        const wv = document.createElement('webview');
        wv.setAttribute('partition', `persist:agent-${m.id}`);
        wv.setAttribute('src', m.url);
        wv.setAttribute('preload', './agent/browser/page/agentPreload.js');
        cell.appendChild(wv);
        grid.appendChild(cell);
        // 监听 AI 回答
        wv.addEventListener('ipc-message', (e) => {
          if (e.channel === 'agent:message-detected') {
            addFeedItem(m.name, e.args[0], false);
          }
        });
      });
    }

    // 监听：独立浏览器窗口关闭后，刷新会议里对应的 webview（同步登录态）
    window.meetingBridge.onRefreshWebview((providerId) => {
      const cells = grid.querySelectorAll('.cell');
      cells.forEach((cell) => {
        const wv = cell.querySelector('webview');
        if (wv && wv.getAttribute('partition') === 'persist:agent-' + providerId) {
          wv.reload();
        }
      });
    });

    // 添加记录到侧边栏
    function addFeedItem(name, text, isUser) {
      const item = document.createElement('div');
      item.className = 'feed-item' + (isUser ? ' user-msg' : '');
      item.innerHTML = `
        <div class="item-header">
          <span class="model-name">${name}</span>
          <span class="time">${new Date().toLocaleTimeString()}</span>
        </div>
        <div class="item-body">${text}</div>
      `;
      item.querySelector('.item-header').onclick = () => item.classList.toggle('expanded');
      feed.insertBefore(item, feed.firstChild);
    }

    // 发送用户消息 → 广播给所有 AI
    function broadcast(text) {
      addFeedItem('你', text, true);
      const cells = grid.querySelectorAll('.cell');
      cells.forEach((cell) => {
        const wv = cell.querySelector('webview');
        const pid = cell.dataset.providerId || '';
        if (wv) {
          wv.executeJavaScript(`
            (async function() {
              const text = ${JSON.stringify(text)};
              const pid = ${JSON.stringify(pid)};

              // 等 500ms 让页面加载完
              await new Promise(r => setTimeout(r, 500));

              // 豆包：先关掉"创建项目"对话框
              if (pid === 'doubao-web') {
                document.querySelectorAll('.modal-close, [class*="close-icon"], button[aria-label="关闭"]').forEach(b => { try { b.click(); } catch(e){} });
              }

              // 找主输入框：所有可见的 textarea + contenteditable，取最后一个
              let input = null;
              const inputs = document.querySelectorAll('textarea, [contenteditable="true"], input[type="text"]');
              const visible = [];
              for (const el of inputs) { if (el.offsetParent !== null) visible.push(el); }
              if (visible.length > 0) input = visible[visible.length - 1];
              if (!input) return;

              // 填文字
              input.focus();
              if (input.tagName === 'TEXTAREA' || input.tagName === 'INPUT') {
                input.value = text;
              } else {
                input.innerText = text;
              }
              input.dispatchEvent(new InputEvent('input', { bubbles: true, inputType: 'insertText', data: text }));
              input.dispatchEvent(new Event('change', { bubbles: true }));

              // 等 300ms
              await new Promise(r => setTimeout(r, 300));

              // 找发送按钮
              let sent = false;
              const btns = document.querySelectorAll('button, [role="button"], div[class*="send"], div[class*="submit"]');
              for (const btn of btns) {
                if (btn.offsetParent === null) continue;
                const label = (btn.getAttribute('aria-label') || btn.textContent || btn.className || '').toLowerCase();
                if (label.includes('发送') || label.includes('send') || label.includes('submit') || label.includes('提交')) {
                  btn.click();
                  sent = true;
                  break;
                }
              }
              // 找不到按钮，按 Enter
              if (!sent) {
                input.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', code: 'Enter', keyCode: 13, which: 13, bubbles: true }));
                input.dispatchEvent(new KeyboardEvent('keypress', { key: 'Enter', code: 'Enter', keyCode: 13, which: 13, bubbles: true }));
                input.dispatchEvent(new KeyboardEvent('keyup', { key: 'Enter', code: 'Enter', keyCode: 13, which: 13, bubbles: true }));
              }
            })();
          `).catch(() => {});
        }
      });
    }

    // 事件绑定
    document.getElementById('btn-send').onclick = () => {
      const text = userInput.value.trim();
      if (text) { broadcast(text); userInput.value = ''; }
    };
    userInput.onkeydown = (e) => { if (e.key === 'Enter') document.getElementById('btn-send').click(); };

    document.getElementById('btn-fullscreen').onclick = () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    };
    document.getElementById('btn-grid3x3').onclick = () => buildGrid(3, 3);
    document.getElementById('btn-grid4x3').onclick = () => buildGrid(4, 3);

    // 默认 3×3
    buildGrid(3, 3);
  </script>
</body>
</html>
